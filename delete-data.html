<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampuStay - Data Deletion</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .brand {
            font-size: 1.6rem;
            font-weight: 800;
            color: #4f46e5;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
        }

        p {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-pill {
            display: inline-block;
            background-color: #4f46e5;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }

        .btn-pill:hover {
            background-color: #4338ca;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
            transform: translateY(-1px);
        }

        .btn-pill:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">CampuStay</div>
        <h1>Data Deletion Process</h1>
        <p>Please contact our support team to request the deletion of your associated personal data.</p>
        
        <a href="mailto:gkiriakos92@gmail.com?subject=Data%20Deletion%20Request" class="btn-pill">
            Contact Support Team
        </a>
    </div>

</body>
</html>
